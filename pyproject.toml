[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-google-adk"
version = "0.1.0"
description = "Google ADK FunctionTools and Plugin for Parallel APIs (search, extract, deep research)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parallel", email = "support@parallel.ai" }]
keywords = ["parallel", "google-adk", "ai-agents", "web-search", "research", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-adk>=1.7",
    "parallel-web>=0.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://parallel.ai"
Documentation = "https://docs.parallel.ai/integrations/google-adk"
Repository = "https://github.com/parallel-web/parallel-google-adk"
Issues = "https://github.com/parallel-web/parallel-google-adk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_google_adk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
